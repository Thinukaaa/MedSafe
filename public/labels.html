<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedSafe · DEMO box labels</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <style>
    :root { --brand: #1D4ED8; --ink: #0F172A; --muted: #475569; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #F5F8FC; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 20px; background: #fff; border-bottom: 1px solid #E2E8F0; }
    .bar h1 { font-size: 1.15rem; margin: 0; }
    .bar p { margin: 0; color: var(--muted); font-size: .88rem; flex: 1 1 320px; }
    .bar button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; cursor: pointer; }
    .bar button:focus-visible { outline: 3px solid rgba(29, 78, 216, .45); outline-offset: 2px; }
    /* A4, 3 × 8 labels of 63.5 × 33.9 mm (fits common 24-up label sheets, or plain paper + scissors) */
    .sheet { width: 210mm; min-height: 297mm; margin: 16px auto; padding: 12.9mm 7.2mm; background: #fff; box-shadow: 0 2px 10px rgba(15, 23, 42, .1);
      display: grid; grid-template-columns: repeat(3, 63.5mm); grid-auto-rows: 33.9mm; column-gap: 2.5mm; }
    .label { border: .2mm dashed #CBD5E1; padding: 1.6mm 2mm; display: grid; grid-template-columns: 1fr 21mm; column-gap: 1.5mm; overflow: hidden; }
    .label .l { display: flex; flex-direction: column; min-width: 0; }
    .name { font-size: 7.6pt; font-weight: 800; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ean { flex: 1 1 auto; max-height: 13.5mm; }
    .meta { font-size: 6pt; color: #334155; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ean { height: 13.5mm; margin-top: .6mm; }
    .ean svg { height: 100%; width: auto; max-width: 100%; display: block; }
    .demo { font-size: 5.6pt; font-weight: 800; color: #6D28D9; letter-spacing: .02em; margin-top: auto; }
    .label .r { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .qr svg { width: 21mm; height: 21mm; display: block; }
    .tag { font-size: 5.4pt; font-weight: 700; margin-top: .5mm; text-align: center; color: #334155; }
    .tag.new { color: #15803D; }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <h1>DEMO box labels</h1>
    <p>16 labels match the DEMO pharmacy stock (scan → quick Sold / Returned / Disposed). 8 “NEW DELIVERY” labels are not in stock (scan → one-tap Add to stock). Print at 100 % scale.</p>
    <button id="printBtn">Print labels</button>
  </div>
  <main class="sheet" id="sheet" aria-label="Label sheet"></main>

  <script src="vendor/bwip-js-4.5.1.min.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/codes.js"></script>
  <script src="js/demo-data.js"></script>
  <script>
  (function () {
    'use strict';
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function svg(opts) { try { return bwipjs.toSVG(opts); } catch (e) { return '<p class="meta">Barcode error: ' + esc(e.message || e) + '</p>'; } }
    function month(e) { const d = Calc.parseExpiry(e); return d ? d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : e; }

    function label(b, isNew) {
      const exp = String(b.expiry).slice(0, 7);
      const qr = Codes.buildMs1({ batchNo: b.batchNo, ean: b.barcode, expiry: exp, qty: b.qty, supplier: b.supplier, shelf: b.location });
      return '<div class="label">' +
        '<div class="l">' +
          '<div class="name">' + esc(b.name) + ' ' + esc(b.strength) + '</div>' +
          '<div class="meta">Batch ' + esc(b.batchNo) + ' · EXP ' + esc(month(exp)) + ' · ' + esc(b.qty) + ' units</div>' +
          '<div class="ean">' + svg({ bcid: 'ean13', text: b.barcode, includetext: true, textsize: 8, height: 9, scale: 2 }) + '</div>' +
          '<div class="demo">DEMO LABEL – not a real product</div>' +
        '</div>' +
        '<div class="r"><div class="qr">' + svg({ bcid: 'qrcode', text: qr, eclevel: 'M', scale: 2 }) + '</div>' +
          '<div class="tag' + (isNew ? ' new' : '') + '">' + (isNew ? 'NEW DELIVERY' : 'IN STOCK') + '</div></div>' +
        '</div>';
    }

    fetch('data/catalogue.json').then(function (r) { return r.json(); }).then(function (cat) {
      const stock = DemoData.build(cat).batches.slice(0, 16);
      const fresh = DemoData.newDeliveries(cat);
      document.getElementById('sheet').innerHTML =
        stock.map(function (b) { return label(b, false); }).join('') + fresh.map(function (b) { return label(b, true); }).join('');
    }).catch(function (e) {
      document.getElementById('sheet').textContent = 'Could not load the catalogue: ' + e.message + ' (open this page through the web server, not as a file).';
    });
    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  })();
  </script>
</body>
</html>
